<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analysis Results</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f5f9; margin: 0; }

        .container {
            width: 90%; max-width: 900px;
            margin: 40px auto; padding: 30px;
            background: white; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #1e293b; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th { background-color: #f8fafc; color: #334155; }

        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .INFO  { background-color: #dcfce7; color: #166534; }
        .WARN  { background-color: #fef9c3; color: #854d0e; }
        .ERROR { background-color: #fee2e2; color: #991b1b; }

        a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Analysis of {{ filename }}</h1>

        <p>
            Total: {{ total }} lines |
            INFO: {{ count_info }} |
            WARN: {{ count_warn }} |
            ERROR: {{ count_error }}
        </p>

        <table>
            <tr>
                <th>Timestamp</th>
                <th>Level</th>
                <th>Message</th>
            </tr>
            {% for log in logs %}
            <tr>
                <td>{{ log.timestamp }}</td>
                <td><span class="badge {{ log.level }}">{{ log.level }}</span></td>
                <td>{{ log.message }}</td>
            </tr>
            {% endfor %}
        </table>

        <p><a href="/">Upload another file</a></p>
    </div>
</body>
</html>
